    <!-- swap these to absolute URLs once the domain is fixed -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stratosphere — Aerospace Club, Jadavpur University" />
    <meta property="og:title" content="Stratosphere — Aerospace Club, Jadavpur University" />
    <meta
      property="og:description"
      content="Stratosphere is the Aerospace Club of Jadavpur University — a student team building rockets, drones and satellites, and running workshops and competitions on campus."

      name="twitter:description"
      content="Stratosphere is the Aerospace Club of Jadavpur University — a student team building rockets, drones and satellites, and running workshops and competitions on campus."
    />
    <meta name="twitter:image" content="https://stratosphere-weld.vercel.app/aerospace_club_ju_cover.jpg" />

    <script>
      // Sets the theme before first paint, otherwise light-theme
      // visitors get a dark flash while React boots.
      (function () {
        try {
          var saved = localStorage.getItem("stratosphere-theme");
          var prefersLight =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme =
            saved || (prefersLight ? "light" : "dark");
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
