name: Deployment smoke test

# Vercel reports every deployment (preview and production) to GitHub.
# When one finishes, hit it with real HTTP requests.
on:
  deployment_status:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:smoke
        env:
          SMOKE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
      - name: Open a P0 issue when production fails its smoke test
        if: failure() && github.event.deployment.environment == 'Production'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `P0: production deploy ${context.payload.deployment.sha.slice(0, 7)} failed smoke tests`,
              body: `Deployment: ${context.payload.deployment_status.environment_url}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nRoll back in Vercel (Deployments → previous → Promote) if users are affected.`,
              labels: ["P0", "incident"],
            });
