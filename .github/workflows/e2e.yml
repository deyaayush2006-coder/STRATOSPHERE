name: E2E

# Vercel reports each deploy back to GitHub as a deployment status. When a
# preview finishes, run the Playwright suite against its URL.
on: deployment_status

permissions:
  contents: read

jobs:
  e2e:
    if: >-
      github.event.deployment_status.state == 'success' &&
      !contains(github.event.deployment_status.environment, 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      # Previews behind Vercel Authentication redirect every request to the
      # Vercel login, so without the bypass secret the suite cannot reach the
      # site at all. Skip with a notice rather than fail on every PR.
      - id: reach
        run: |
          headers=()
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            headers=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi
          location=$(curl -s -o /dev/null -w '%{redirect_url}' "${headers[@]}" "$E2E_BASE_URL/")
          if [[ "$location" == *vercel.com/sso-api* ]]; then
            if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
              echo "::error::The preview still redirects to the Vercel login with the bypass header. Check VERCEL_AUTOMATION_BYPASS_SECRET."
              exit 1
            fi
            echo "::notice::Preview is protected by Vercel Authentication and VERCEL_AUTOMATION_BYPASS_SECRET is not set, so E2E was skipped. Add the secret (Vercel → Settings → Deployment Protection → Protection Bypass for Automation) to run it."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.reach.outputs.run == 'true'
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        if: steps.reach.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.reach.outputs.run == 'true'
        run: npm ci
      - if: steps.reach.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.reach.outputs.run == 'true'
        run: npm run test:e2e
        env:
          E2E_ADMIN_PATH: ${{ secrets.E2E_ADMIN_PATH }}
      - uses: actions/upload-artifact@v4
        if: failure() && steps.reach.outputs.run == 'true'
        with:
          name: playwright-report
          path: playwright-report/
