# docker compose --env-file .env.local up --build
#
# Values come from the env file passed with --env-file (or from your shell).
# NEXT_PUBLIC_* are build args; SUPABASE_SERVICE_ROLE_KEY is runtime only.
# The site is served on http://localhost:${APP_PORT:-3000}.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_ADMIN_PATH: ${NEXT_PUBLIC_ADMIN_PATH:-admin}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    image: stratosphere:latest
    environment:
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
